version: '3.8'

services:
  # Database Service (MongoDB)
  mongo:
    image: mongo:7-jammy
    container_name: clientflow-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: clientflow
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - clientflow-network

  # Backend API Server
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: clientflow-server
    restart: always
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/clientflow
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_production_key_change_me}
    ports:
      - "5001:5001"
    depends_on:
      - mongo
    networks:
      - clientflow-network

  # Frontend React SPA (Nginx)
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: clientflow-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - clientflow-network

volumes:
  mongo_data:
    driver: local

networks:
  clientflow-network:
    driver: bridge
